name: Build Throwable Visuals

on:
  workflow_dispatch:
  push:
    branches:
      - agent/throwable-visuals-hold-preview
    paths:
      - "throwable_chunks/**"
      - "throwable_test2_patch.b64"
      - ".github/workflows/build-throwable-visuals.yml"
  pull_request:
    branches:
      - main
    paths:
      - "throwable_chunks/**"
      - "throwable_test2_patch.b64"
      - ".github/workflows/build-throwable-visuals.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand and patch source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $base64 = (Get-ChildItem "throwable_chunks/*.txt" | Sort-Object Name | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }) -join ""
          $bytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes("throwable-visuals-source.zip", $bytes)
          Expand-Archive -Path throwable-visuals-source.zip -DestinationPath . -Force

          $patchBytes = [Convert]::FromBase64String((Get-Content throwable_test2_patch.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes("throwable_test2.patch.gz", $patchBytes)
          $input = [IO.File]::OpenRead("throwable_test2.patch.gz")
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create("throwable_test2.patch")
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          git apply --whitespace=nowarn throwable_test2.patch

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/ThrowableVisuals/ThrowableVisuals.csproj

      - name: Build
        run: dotnet build src/ThrowableVisuals/ThrowableVisuals.csproj -c Release --no-restore

      - name: Prepare test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "artifacts"
          $package = Join-Path $root "Thunderstore-Package"
          $plugins = Join-Path $package "plugins"
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null

          Copy-Item "src/ThrowableVisuals/bin/Release/net472/ThrowableVisuals.dll" $plugins
          Copy-Item "thunderstore/manifest.json" $package
          Copy-Item "thunderstore/README.md" $package
          Copy-Item "thunderstore/CHANGELOG.md" $package
          Copy-Item "thunderstore/icon.png" $package

          Compress-Archive -Path "$package/*" -DestinationPath "$root/PiranhaFraud-ThrowableVisuals-0.1.1-test2.zip" -Force
          Copy-Item "src/ThrowableVisuals/bin/Release/net472/ThrowableVisuals.dll" "$root/ThrowableVisuals-0.1.1-test2.dll"

          $sourceItems = @("src", "thunderstore", "README.md", "BUILDEN_DE.md", ".gitignore") | Where-Object { Test-Path $_ }
          Compress-Archive -Path $sourceItems -DestinationPath "$root/STRAFTAT-ThrowableVisuals-source-0.1.1-test2.zip" -Force

          @"
          STRAFTAT Throwable Visuals 0.1.1-test2

          Recommended installation:
          Import PiranhaFraud-ThrowableVisuals-0.1.1-test2.zip as a local mod in r2modman/Thunderstore.

          Direct installation:
          Copy ThrowableVisuals-0.1.1-test2.dll into the active profile's BepInEx/plugins/ThrowableVisuals folder.

          PreviewMode defaults to WhileHeld. It can be changed to WhilePreparing in the config/mod menu.
          Fuse-limited grenades are clipped at the predicted detonation time.
          F11 = toggle overlay
          F12 = diagnostics
          "@ | Set-Content "$root/INSTALLATION.txt" -Encoding UTF8

          Get-FileHash "$root/ThrowableVisuals-0.1.1-test2.dll", "$root/PiranhaFraud-ThrowableVisuals-0.1.1-test2.zip", "$root/STRAFTAT-ThrowableVisuals-source-0.1.1-test2.zip" -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String | Set-Content "$root/SHA256.txt" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThrowableVisuals-0.1.1-test2
          path: artifacts/*
          if-no-files-found: error
